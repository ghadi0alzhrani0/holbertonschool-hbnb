<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Create or edit an HBnB property."><title>Property editor - HBnB</title><link rel="icon" href="images/icon.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=Playfair+Display:wght@500;600;700&amp;display=swap" rel="stylesheet"><link rel="stylesheet" href="css/global.css?v=20260825a"><link rel="stylesheet" href="css/portal.css?v=20260825a">
</head>
<body>
  <header class="site-header"><nav class="nav-shell container" aria-label="Primary navigation"><a class="brand" href="index.html"><img class="logo" src="images/logo.png" alt="HBnB logo"><span class="brand-name">HBNB</span></a><div class="nav-links"><a class="nav-link" data-nav="owner_home.html" href="owner_home.html">Owner home</a><a class="nav-link" data-nav="manage_places.html" href="manage_places.html">Properties</a><a class="nav-link" data-nav="owner_bookings.html" href="owner_bookings.html">Reservations</a></div><div class="nav-actions"><a id="login-link" class="nav-action login-button" href="login.html">Sign in</a><a id="nav-profile" class="nav-action primary" href="profile.html" style="display:none">Profile</a></div></nav></header>
  <main class="container page"><section class="portal-hero"><div><div class="eyebrow">Property editor</div><h1 id="place-editor-title" class="page-title">Add a<br><em>new stay.</em></h1><p class="page-subtitle">Complete the core place fields and the custom HBnB details in four steps.</p></div></section>
    <section class="section"><nav class="steps" aria-label="Property form steps"><button class="step-button active" type="button" data-step="0">1. Basics</button><button class="step-button" type="button" data-step="1">2. Rooms</button><button class="step-button" type="button" data-step="2">3. Amenities</button><button class="step-button" type="button" data-step="3">4. Location</button></nav>
      <form id="place-editor-form" class="form">
        <section class="form-step active" data-form-step="0"><div class="field"><label for="place-title-input">Property title</label><input id="place-title-input" maxlength="100" required></div><div class="field"><label for="place-description-input">Description</label><textarea id="place-description-input" required></textarea></div><div class="field"><label for="place-image-input">Cover image</label><input id="place-image-input" type="file" accept="image/jpeg,image/png,image/webp"><div id="place-image-preview" class="property-image-preview hidden"><img id="place-image-preview-img" alt="Property cover preview"><button id="remove-place-image" class="btn danger" type="button">Remove image</button></div></div><div class="form-grid"><div class="field"><label for="place-type-input">Property type</label><select id="place-type-input" required></select></div><div class="field"><label for="place-policy-input">Cancellation policy</label><select id="place-policy-input" required></select></div></div><div id="admin-owner-field" class="field hidden"><label for="place-business-owner-input">Business owner</label><select id="place-business-owner-input"><option value="">No business owner</option></select></div><div class="form-grid"><div class="field"><label for="place-rooms-input">Number of rooms</label><input id="place-rooms-input" type="number" min="1" value="1" required></div><div class="field"><label for="place-bathrooms-input">Bathrooms</label><input id="place-bathrooms-input" type="number" min="1" value="1" required></div></div><div class="field"><label for="place-guests-input">Maximum guests</label><input id="place-guests-input" type="number" min="1" value="2" required></div></section>
        <section class="form-step" data-form-step="1"><div class="section-head"><div><div class="eyebrow">Sleeping layout</div><h2 class="section-title">Room details</h2></div><button id="add-room-row" class="btn" type="button">Add room</button></div><div id="room-builder" class="room-builder"></div></section>
        <section class="form-step" data-form-step="2"><div class="eyebrow">What is included</div><h2 class="section-title">Amenities</h2><div id="amenity-picker" class="amenity-picker"></div></section>
        <section class="form-step" data-form-step="3"><div class="form-grid"><div class="field"><label for="place-city-input">City</label><select id="place-city-input" required><option value="">Choose city</option></select></div><div class="field"><label for="place-price-input">Price per night</label><input id="place-price-input" type="number" min="1" step="0.01" required></div></div><div class="form-grid"><div class="field"><label for="place-latitude-input">Latitude</label><input id="place-latitude-input" type="number" min="-90" max="90" step="any" required></div><div class="field"><label for="place-longitude-input">Longitude</label><input id="place-longitude-input" type="number" min="-180" max="180" step="any" required></div></div><div id="place-editor-error" class="error-box"></div></section>
        <div class="form-footer"><button id="previous-place-step" class="btn hidden" type="button">Previous</button><a id="cancel-place-editor" class="btn" href="manage_places.html">Cancel</a><button id="next-place-step" class="btn primary" type="button">Next</button><button id="save-place" class="btn primary hidden" type="submit">Save property</button></div>
      </form>
    </section>
  </main>
  <footer class="site-footer container">© 2026 HBnB. All rights reserved.</footer><div id="toast" class="toast" role="status" aria-live="polite"></div><script src="js/common.js?v=20260822c" defer></script><script src="js/add_place.js?v=20260825a" defer></script>
</body>
</html>
