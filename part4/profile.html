<header class="site-header"><nav class="nav-shell container" aria-label="Primary navigation"><a class="brand" href="index.html" aria-label="HBnB home"><img class="logo" src="images/logo.png" alt="HBnB logo" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'"><span class="brand-mark" style="display:none">H</span><span class="brand-name">HBNB</span></a><div class="nav-links"><a class="nav-link" data-nav="index.html" href="index.html">Home</a><a class="nav-link" data-nav="explore.html" href="explore.html">Explore</a><a class="nav-link" data-nav="bookings.html" href="bookings.html">Bookings</a></div><div class="nav-actions"><a id="login-link" class="nav-action login-button" href="login.html">Sign in</a><a id="nav-profile" class="nav-action primary" href="profile.html" style="display:none">Profile</a></div></nav></header>

<main class="container page"><section class="hero-card"><div class="profile-head"><div id="profile-avatar" class="avatar">H</div><div><div class="eyebrow">Your account</div><h1 id="profile-name" style="font-family:'Playfair Display',Georgia,serif;font-size:2.8rem;color:var(--brown);margin:0">Loading…</h1><p id="profile-email" class="muted">—</p></div><button id="logout-btn" class="btn danger" type="button">Sign out</button></div></section><section class="section"><div class="stat-strip"><div class="stat"><span id="profile-activity-label" class="muted small">Bookings</span><strong id="stat-bookings">—</strong></div><div class="stat"><span class="muted small">Notifications</span><strong id="stat-notifications">—</strong></div><div class="stat"><span class="muted small">Account</span><strong style="color:var(--green)">Active</strong></div><div class="stat"><span class="muted small">Role</span><strong id="profile-role">—</strong></div></div></section><section class="section profile-grid"><div class="card profile-panel"><div class="section-head"><div><div class="eyebrow">Identity</div><h2 class="section-title">Profile details</h2></div></div><form id="profile-form" class="form"><div class="field"><label id="profile-first-label" for="profile-first">First name</label><input id="profile-first" required></div><div class="field"><label id="profile-last-label" for="profile-last">Last name</label><input id="profile-last" required></div><div id="profile-phone-field" class="field hidden"><label for="profile-phone">Phone number</label><input id="profile-phone" type="tel"></div><button class="btn primary" type="submit">Save changes</button></form></div><div class="card profile-panel"><div class="section-head"><div><div class="eyebrow">Recent activity</div><h2 id="profile-activity-title" class="section-title">Your bookings</h2></div><a id="profile-activity-link" class="btn" href="bookings.html">Open all</a></div><div id="profile-bookings" class="list"><div class="empty">Loading…</di
