<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Manage reservations received by HBnB properties."><title>Reservations - HBnB</title><link rel="icon" href="images/icon.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=Playfair+Display:wght@500;600;700&amp;display=swap" rel="stylesheet"><link rel="stylesheet" href="css/global.css?v=20260822c"><link rel="stylesheet" href="css/portal.css?v=20260822c">
</head>
<body>
  <header class="site-header"><nav class="nav-shell container" aria-label="Primary navigation"><a class="brand" href="index.html"><img class="logo" src="images/logo.png" alt="HBnB logo"><span class="brand-name">HBNB</span></a><div class="nav-links"><a class="nav-link" data-nav="owner_home.html" href="owner_home.html">Owner home</a><a class="nav-link" data-nav="manage_places.html" href="manage_places.html">Properties</a><a class="nav-link" data-nav="owner_bookings.html" href="owner_bookings.html">Reservations</a></div><div class="nav-actions"><a id="login-link" class="nav-action login-button" href="login.html">Sign in</a><a id="nav-profile" class="nav-action primary" href="profile.html" style="display:none">Profile</a></div></nav></header>
  <main class="container page"><section class="portal-hero"><div><div class="eyebrow">Reservation desk</div><h1 class="page-title">Bookings and<br><em>guest care.</em></h1><p class="page-subtitle">Review guest counts, update each stay, and rate a guest after checkout.</p></div></section><section class="manager-toolbar"><div class="field"><label for="booking-status-filter">Status</label><select id="booking-status-filter"><option value="all">All</option><option value="pending">Pending</option><option value="confirmed">Confirmed</option><option value="checked_in">Checked in</option><option value="completed">Completed</option><option value="cancelled">Cancelled</option></select></div><span id="owner-booking-count" class="muted">0 reservations</span></section><section class="section"><div style="overflow:auto"><table class="booking-table"><thead><tr><th>Guest</th><th>Property</th><th>Dates</th><th>Guests</th><th>Status</th><th>Actions</th></tr></thead><tbody id="owner-booking-table"></tbody></table></div></section></main>
  <div id="guest-review-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="guest-review-title"><form id="guest-review-form" class="modal-panel form"><div class="modal-head"><div><div class="eyebrow">Completed reservation</div><h2 id="guest-review-title" class="section-title">Review the guest</h2></div><button id="close-guest-review" class="icon-button" type="button" aria-label="Close">×</button></div><input id="guest-review-booking" type="hidden"><input id="guest-review-owner" type="hidden"><div class="rating-fields"><div class="field"><label for="guest-cleanliness">Cleanliness</label><input id="guest-cleanliness" type="number" min="1" max="5" value="5" required></div><div class="field"><label for="guest-communication">Communication</label><input id="guest-communication" type="number" min="1" max="5" value="5" required></div><div class="field"><label for="guest-rules">House rules</label><input id="guest-rules" type="number" min="1" max="5" value="5" required></div></div><div class="field"><label for="guest-review-text">Private host note</label><textarea id="guest-review-text" required></textarea></div><button id="guest-review-submit" class="btn primary full" type="submit">Publish guest review</button></form></div>
  <footer class="site-footer container">© 2026 HBnB. All rights reserved.</footer><div id="toast" class="toast" role="status" aria-live="polite"></div><script src="js/common.js?v=20260822c" defer></script><script src="js/owner_bookings.js" defer></script>
</body>
</html>
